services:
  agent:
    build:
      context: .
    image: brgrbyte-agent:local
    env_file:
      - .env
    environment:
      BRGRBYTE_URL: ${BRGRBYTE_URL:-${NETWORKPATH_URL:-}}
      BRGRBYTE_AGENT_CREDENTIAL: ${BRGRBYTE_AGENT_CREDENTIAL:-${NETWORKPATH_AGENT_CREDENTIAL:-}}
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    restart: unless-stopped
