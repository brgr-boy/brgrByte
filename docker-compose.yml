services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networkpath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-networkpath}
    volumes:
      - networkpath-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      NETWORKPATH_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-networkpath}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-networkpath}
      NETWORKPATH_JWT_SECRET_KEY: ${NETWORKPATH_JWT_SECRET_KEY:?Set NETWORKPATH_JWT_SECRET_KEY in .env}
      NETWORKPATH_ADMIN_USERNAME: ${NETWORKPATH_ADMIN_USERNAME:?Set NETWORKPATH_ADMIN_USERNAME in .env}
      NETWORKPATH_ADMIN_PASSWORD: ${NETWORKPATH_ADMIN_PASSWORD:?Set NETWORKPATH_ADMIN_PASSWORD in .env}
      NETWORKPATH_CORS_ORIGINS: ${NETWORKPATH_CORS_ORIGINS:-http://localhost:8080}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  networkpath-postgres:
