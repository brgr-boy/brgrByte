name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: ruff check app migrations tests
        working-directory: backend
      - run: pytest -q
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
        env:
          NETWORKPATH_DATABASE_URL: "sqlite+pysqlite:///:memory:"
          NETWORKPATH_JWT_SECRET_KEY: ci-migration-test-key-at-least-32-characters
          NETWORKPATH_ADMIN_USERNAME: ci-admin
          NETWORKPATH_ADMIN_PASSWORD: ci-migration-test-password

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container-builds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
